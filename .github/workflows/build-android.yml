# This workflow is called from ci.yml on every build, and also runs on a
# schedule / dispatch to auto-repackage APK/AAB files when the underlying
# Docker pipeline image has been updated.
#
# The build runs in parallel with ci.yml's build-and-test jobs; deployment
# is handled separately by deploy-android.yml (called either from ci.yml
# or from the deploy-orchestration job here).

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force Android rebuild
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      force:
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 0 * * *" # nightly UTC

permissions:
  actions: read
  contents: read

jobs:
  # ─── Check source-image updates ────────────────────────────────────
  # When triggered standalone (schedule / dispatch) we compare the digest
  # of the Docker pipeline image and only build when it has changed.
  # From ci.yml the "force" input always triggers a build.
  check-image-updates:
    runs-on: ubuntu-24.04
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            mirror.gcr.io/yeicor/colmap-openmvs:cpu-latest \
            --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > current-digest.txt

      - uses: dawidd6/action-download-artifact@v21
        continue-on-error: true
        with:
          workflow: build-android.yml
          branch: main
          name: source-image-digest
          search_artifacts: true
          path: previous
          if_no_artifact_found: warn

      - id: check
        env:
          FORCE: ${{ inputs.force || false }}
          CURRENT_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f previous/digest.txt ]; then
            echo "No previous digest found"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_DIGEST=$(cat previous/digest.txt)

          echo "Current:  $CURRENT_DIGEST"
          echo "Previous: $PREVIOUS_DIGEST"

          if [ "$CURRENT_DIGEST" != "$PREVIOUS_DIGEST" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Build ──────────────────────────────────────────────────────────
  # Parallelized across (target × package-type) — AAB and APK build
  # simultaneously for both architectures.
  build:
    needs: check-image-updates
    if: needs.check-image-updates.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-android
            package-type: aab
          - target: x86_64-linux-android
            package-type: apk
          - target: aarch64-linux-android
            package-type: aab
          - target: aarch64-linux-android
            package-type: apk
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # GitHub-hosted ubuntu-24.04 runners only have ~14 GB of SSD, while a
      # cold x86_64 Android release build needs most of it (800 crates, a
      # ~2 GiB extracted rootfs cache, jniLibs copies and the Gradle output).
      # Reclaim the preinstalled toolchains this job never uses. This runs
      # before the cache restore so the freed space is actually available to
      # the build.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/CodeQL" || true
          sudo apt-get clean
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # All four matrix legs report the same job id ("build"), so without
          # an explicit key they compete for a single cache entry: the first
          # leg to save wins and the others restore a cache full of *foreign*
          # target artifacts (near-zero hit rate) and rebuild ~800 crates from
          # scratch on every run. Keying on the target triple gives each
          # architecture its own `target/<triple>` cache.
          key: ${{ matrix.target }}
          # A leg that fails late (Gradle, bundling) still produced hundreds of
          # valid dependency artifacts; keeping them means the next run makes
          # progress instead of starting from zero every night.
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld \
            patchelf

      # Auto-sync the dx CLI with the project's dioxus crate version.
      # install.sh defaults to the latest release, which may be incompatible
      # with the dioxus version in Cargo.lock and break the build ("dx and
      # dioxus versions are incompatible!"). The resolved version from
      # Cargo.lock is mapped to the matching `vX.Y.Z` dx release tag, so a
      # Renovate bump of dioxus automatically pulls the matching dx.
      - shell: bash
        run: |
          set -euo pipefail
          DIOXUS_VERSION=$(grep -A1 '^name = "dioxus"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          if [ -z "$DIOXUS_VERSION" ]; then
            echo "::error::Could not determine dioxus version from Cargo.lock"
            exit 1
          fi
          TAG="v$DIOXUS_VERSION"
          echo "Syncing dx CLI to dioxus $TAG (from Cargo.lock)"
          # ubuntu runners are x86_64 Linux; fall back to latest dx if the
          # matching release asset does not exist (e.g. version bump landed
          # before its dx release was published).
          ASSET_URL="https://github.com/DioxusLabs/dioxus/releases/download/${TAG}/dx-x86_64-unknown-linux-gnu.zip"
          if [ "$(curl -sSL -o /dev/null -w '%{http_code}' "$ASSET_URL")" != "200" ]; then
            echo "::warning::No dx release asset for ${TAG}; falling back to latest dx"
            curl -sSL https://dioxus.dev/install.sh | bash
          else
            curl -sSL https://dioxus.dev/install.sh | bash -s -- "$TAG"
          fi

      - shell: bash
        run: |
          dx bundle --android --verbose --package-types ${{ matrix.package-type }} --features server --target ${{ matrix.target }} --release

      # `dx` parses cargo output as JSON and bails on `build-finished` before
      # reading cargo's plain-text error, so build-script panics and OOM/disk
      # kills show up as a bare "cargo build finished with errors" with no
      # diagnostics. Dump everything that can identify the real failure.
      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::group::Disk"
          df -h /
          echo "::endgroup::"
          echo "::group::Memory"
          free -m
          echo "::endgroup::"
          echo "::group::OOM / kernel messages"
          sudo dmesg | tail -50
          echo "::endgroup::"
          echo "::group::Build script log"
          cat target/android-build.log 2>/dev/null || echo "(no target/android-build.log)"
          echo "::endgroup::"
          echo "::group::Target sizes"
          du -sh target/* 2>/dev/null | sort -h
          echo "::endgroup::"

      - shell: bash
        if: matrix.package-type == 'aab'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base64 -d<<<"$ANDROID_KEYSTORE_B64">ks.jks
          find target -type f -path '*/release/android/*/bundle/*.aab' -exec \
            jarsigner -keystore ks.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -signedjar {} {} "$ANDROID_KEY_ALIAS" \;

      - shell: bash
        if: matrix.package-type == 'apk'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          base64 -d<<<"$ANDROID_KEYSTORE_B64">ks.jks
          ZIPALIGN=$(command -v zipalign) || [ -n "${ANDROID_SDK_ROOT:-}" ] && ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(command -v apksigner) || [ -n "${ANDROID_SDK_ROOT:-}" ] && APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "${ZIPALIGN}" ] && [ -n "${APKSIGNER}" ]; then
            find target -type f -path '*/outputs/apk/debug/*.apk' -exec sh -c '"$0" -p -f -v 4 "$1" "$1.tmp" && mv "$1.tmp" "$1"' "$ZIPALIGN" {} \;
            find target -type f -path '*/outputs/apk/debug/*.apk' -exec \
              "$APKSIGNER" sign --ks ks.jks --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD {} \;
          else
            echo "⚠️  zipalign/apksigner not found — skipping APK signing"
          fi

      - shell: bash
        if: matrix.package-type == 'aab'
        run: |
          set -Eeuo pipefail
          mkdir -p android-output
          for aab in $(find target -type f -path '*/release/android/*/bundle/*.aab'); do
            cp "$aab" "android-output/app-release-${{ matrix.target }}.aab"
          done
          for mapping in $(find target -type f -path '*/release/android/*/mapping.txt'); do
            cp "$mapping" "android-output/mapping-${{ matrix.target }}.txt"
          done
          for symbols_dir in $(find target -type d -path '*/release/android/*/merged_jni_libs/release/*/out'); do
            for abi_dir in "$symbols_dir"/*/; do
              [ -d "$abi_dir" ] || continue
              abi="$(basename "$abi_dir")"
              mkdir -p "android-output/debug-symbols/${abi}"
              cp -r "$abi_dir/." "android-output/debug-symbols/${abi}/"
            done
          done
          echo "📦 Artifact contents:"
          find android-output -type f

      - shell: bash
        if: matrix.package-type == 'apk'
        run: |
          set -Eeuo pipefail
          mkdir -p apk-collect
          for apk in $(find target -type f -path '*/outputs/apk/debug/*.apk'); do
            target_name="app-release-${{ matrix.target }}.apk"
            cp "$apk" "apk-collect/$target_name"
          done
          echo "📦 Artifact contents:"
          find apk-collect -type f

      - uses: actions/upload-artifact@v7
        if: matrix.package-type == 'aab'
        with:
          name: build-android-aab-${{ matrix.target }}
          path: android-output/

      - uses: actions/upload-artifact@v7
        if: matrix.package-type == 'apk'
        with:
          name: build-android-apk-${{ matrix.target }}
          path: apk-collect/

  # ─── Save source digest ─────────────────────────────────────────────
  # After the build completes, so the next cron check skips this image revision.
  save-digest:
    needs: [check-image-updates, build]
    if: needs.check-image-updates.outputs.should-build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '${{ needs.check-image-updates.outputs.digest }}' > digest.txt

      - uses: actions/upload-artifact@v7
        with:
          name: source-image-digest
          path: digest.txt
